## 蜗牛和玫瑰树
园子的四周是一圈榛子树丛，像一排篱笆。外面是田野和草地，有许多牛羊。园子的中间有一棵花繁的玫瑰树，树下有一只蜗牛，他体内有许多东西，那是他自己。

“等着，等轮到我吧！”他说道，“我不止开花，不止结榛子，或者说像牛羊一样只产奶，我要贡献更多的东西。”“我真是对您大抱希望呢，”玫瑰树说道。“我斗胆请教一下，您什么时候兑现呢？”

“我得慢慢来，”蜗牛说道。“您总是那么着急！着急是不能成事的。”

第二年蜗牛仍躺在玫瑰树下大体上同一个地方的太阳里。玫瑰树结了骨朵，绽出花朵，总是那么清爽，那么新鲜。蜗牛伸出一半身子，探出他的触角，接着又把触角缩了回去。

“什么东西看来都和去年一样！没有出现什么进步！玫瑰树还在开他的玫瑰花，再没有什么新招了！”

夏天过去，秋天到来，玫瑰还在开花，结骨朵，一直到雪飘了下来，寒风呼啸，天气潮湿；玫瑰树垂向地面，蜗牛钻到地里。

接着又开始了新的一年，玫瑰又吐芽抽枝，蜗牛也爬了出来。

“现在您已经成了老玫瑰枝了，”他说道，“您大约快要了结生命了。您把您所有的一切都给了世界，这是否有意义，是一个我没有时间考虑的问题。但很明显，您一点也没有为您的内在发展做过点什么。否则的话，您一定会另有作为的。您能否认吗？您很快便会变成光秃秃的枝子了！您明白我讲的吗？”

“您把我吓了一跳，”玫瑰树说道。“我从来没有想过这一点。”

“不错，看来您从来不太费神思考问题！您是否曾经考虑过，您为什么开花，开花是怎么一回事，为什么是这样而不是另外一样呢！”

“没有！”玫瑰树说道。“我在欢乐中开花，因为我只能这样。太阳是那样暖和，空气是那样新鲜，我吸吮清澈的露珠和猛烈的雨水；我呼吸，我生活！泥土往我身体内注入一股力量，从上面涌来一股力量，我感到一阵幸福，总是那么新鲜，那么充分，因此我必须不断开花。那是我的生活，我只能这样！”

“您过的是一种很舒服的日子。”蜗牛说道。

“的确如此！我得到了一切！”玫瑰树说道；“但是您得到的更多！您是一位善于思考、思想深刻的生灵。您的秉赋极高，令世界吃惊。”

“这我压根儿就没有想过，”蜗牛说道。“世界与我不相干！我和世界有什么关系？我自身与我身体的事就够多的了。”

可是难道说我们不应该把我们最好的东西奉献给别人吗！把我们能拿出的——！是啊，我只做到了拿出玫瑰来！——可是您呢？您得到了那么多，您给了世界什么呢？您给它什么呢？”

“我给什么？我给什么！我朝它吐唾沫！它不中用，它和我没有关系。您去开您的玫瑰花去吧，您能干的就这么多了！让榛子树结它的榛子！让牛和羊产奶去吧！它们各有自己的群众，我的在我自身里！我缩进自己的身体里，呆在自己的躯壳里。世界与我没有关系！”

于是蜗牛就缩回到自己的屋子里，带上了门。

“真是叫人伤心！”玫瑰树说道。“就算我特别愿意，我也无法把身子缩进去，我必须总是开花，总是开玫瑰花。花瓣落了，被风吹走！不过我却看见一位家庭主妇把一朵玫瑰花夹在赞美诗集里，我的另一朵玫瑰花被插在一个年轻美丽的姑娘的胸前，还有一朵被一个幸福地欢笑着的小孩子吻了一下。这些都叫我很高兴，这是真正的幸福。这是我的回忆，是我的生活！”

玫瑰天真无邪地开着花。蜗牛缩在他的屋子里，世界和他没有关系。

一年年过去了。

蜗牛成了泥土里的泥土，玫瑰树成了泥土中的泥土，连赞美诗中留作纪念的玫瑰也枯萎了，——可是园子里新的玫瑰树开着花，园子里爬出了新的蜗牛，它们缩在自己的屋子里，吐着涎液，——世界与它们无关。

## 亚麻（上）
一棵亚麻开满了花。它开满了非常美丽的蓝花。花朵柔软得像飞蛾的翅膀，甚至比那还要柔软。太阳照在亚麻身上，雨雾润泽着它。这正好像孩子被洗了一番以后，又从妈妈那里得到了一个吻一样——使他们变得更可爱。亚麻也是这样。

“人们说，我长得太好了，”亚麻说，“并且还说我又美又长，将来可以织成很好看的布。嗨，我是多么幸运啊！我将来一定是最幸运的人！太阳光多么使人快乐！雨的味道是多么好，多么使人感到新鲜！我是分外地幸运；我是一切东西之中最幸运的！”

“对，对，对！”篱笆桩说。“你不了解这个世界，但是我们了解，因为我们身上长得有节！”于是它们就悲观地发出吱吱格格的声音来：吱——格——嘘，

拍——呼——吁，

歌儿完了。

“没有，歌儿并没有完了呀！”亚麻说。“明天早晨太阳就会出来，雨就会使人愉快。我能听见我在生长的声音，我能觉得我在开花！我是一切生物中最幸运的！”

不过有一天，人们走过来捏着亚麻的头，把它连根从土里拔出来。它受了伤。

它被放在水里，好像人们要把它淹死似的。然后它又被放在火上，好像人们要把它烤死似的。这真是可怕！

“一个人不能永远过着幸福的时光！”亚麻说。“一个人应该吃点苦，才能懂得一些事情。”

不过更糟糕的时候到来了。亚麻被折断了，撕碎了，揉打了和梳理了一通。是的，它自己也不知道这是一套什么玩艺儿。它被装在一架纺车上——吱格！吱格！

吱格——这把它弄得头昏脑涨，连思想都不可能了。

“我有个时候曾经是非常幸运的！”它在痛苦中作这样的回忆。“一个人在幸福的时候应该知道快乐！快乐！快乐！啊！”当它被装到织布机上去的时候，它仍然在说这样的话。于是它被织成了一大块美丽的布。所有的亚麻，每一根亚麻，都被织成了这块布。

“不过，这真是出人意料之外！我以前决不会相信的！嗨！我是多么幸福啊！

是的，篱笆桩这样唱是有道理的：吱——格——嘘，

拍——呼——吁！

“歌儿一点也不能算是完了！它现在还不过是刚刚开始呢！这真是意想不到！

如果说我吃了一点苦头，总算没有白吃。我是一切东西中最幸福的！我是多么结实、多么柔和、多么白、多么长啊！我原不过只是一棵植物——哪怕还开得有花；和从前比起来，我现在完全是两样！从前没有谁照料我，只有在天下雨的时候我才得到一点水。现在却有人来照料我了！女仆人每天早上把我翻一翻，每天晚上我在水盆里洗一个淋水浴。是的，牧师的太太甚至还作了一篇关于我的演讲，说我是整个教区里最好的一块布。我不能比这更幸福了！”

现在这块布来到屋子里面，被一把剪刀裁剪着。人们是在怎样剪它，在怎样裁它，在怎样用针刺它啊！人们就是这样对付它，而这并不是太愉快的事情。它被裁成一件衣服的１２个没有名字、但是缺一不可的部分——恰恰是一打！

“嗨，现在我总算得到一点结果！这就是我的命运！是的，这才是真正的幸福呢！我现在算是对世界有点用处了，而这也是应该的——这才是真正的快乐！我们变成了１２件东西，但同时我们又是一个整体。我们是一打，这是稀有的幸运！”

## 亚麻（下）
许多年过去了。它们再无法守在一起了。

“有一天总会完了，”每一个部分说。“我倒希望我们能在一起待得久一点，不过你不能指望不可能的事情呀！”

它们现在被撕成了烂布片。它们以为现在一切都完了，因为它们被剁细了，并且被水煮了。是的，它们自己也不知道它们是什么。最后它们变成了美丽的白纸。

“哎唷，这真是奇事，一件可爱的奇事！”纸说。“我现在比以前更美丽了，人们将在我身上写出字来！这真是绝顶的好运气！”

它上面写了字——写了最美丽的故事。人们听着这些写下来的故事——这都是些聪明和美好的事情，听了能够使人变得更聪明和更美好。这些写在纸上的字是最大的幸福。

“这比我是一朵田野里的小蓝花时所能梦想得到的东西要美妙得多。我怎能想到我能在人类中间散布快乐和知识呢？我连自己都不懂得这道理！不过事实确是如此。上帝知道，除了我微弱的力量为了保存自己所能做到的一点事情以外，我什么本事也没有！然而他却不停地给我快乐和光荣。每次当我一想到‘歌儿完了’的时候，歌儿却以更高贵、更美好的方式重新开始。现在无疑地我将要被送到世界各地去旅行，好使人人都能读到我。这种事情是很可能的！从前我有蓝花儿，现在每一朵花儿都变成了最美丽的思想！我在一切东西中是最幸福的！”

不过纸并没有去旅行，却到一个印刷所里去了。它上面所写的东西都被排成了书，也可以说几千几百本的书，因为这样才可以使无数的人得到快乐和好处。这比起写在纸上、周游世界不到半路就毁坏了的这种情况来，要好得多。

“是的，这的确是一个最聪明的办法！”写上了字的纸想。

“我确实没有想到这一点！我将待在家里，受人尊敬，像一位老祖父一样！文章是写在我的身上；字句从笔尖直接流到我的身体里面去。我没有动，而是书本在各处旅行。我现在的确能够做点事情！我是多么高兴，我是多么幸福啊！”

于是纸被卷成一个小卷，放到书架上去了。

“工作过后休息一阵是很好的，”纸说。“把思想集中一下，想想自己肚皮里有些什么东西——这是对的。现在我第一次知道我有些什么本事——认识自己就是进步。我还会变成什么呢？我仍然会前进；我永远是前进的！”

有一天纸被放在炉子上要烧掉，因为它不能卖给杂贷店里去包黄油和红糖。屋里的孩子们都围做一团；他们要看看它烧起来，他们要看看火灰里的那些红火星——这些火星很快就一个接着一个地不见了，熄灭了。这很像放了学的孩子。最后的一颗火星简直像老师：大家总以为他早走了，但是他却在别人的后面走出来。

所有的纸被卷成一卷，放在火上。噢！它烧得才快呢。

“噢！”它说，同时变成了一朵明亮的焰花。焰花升得很高，亚麻从来没有能够把它的小蓝花开得这样高过。它发出白麻布从来发不出的闪光。它上面写的字一忽儿全都变红了；那些词句和思想都成了火焰。

“现在我要直接升向太阳了！”火焰中有一个声音说。这好像一千个声音在合唱。焰花通过烟囱一直跑到外面去。在那儿，比焰花还要细微的、人眼所看不见的、微小的生物在浮动着，数目之多，比得上亚麻所开的花朵。它们比产生它们的火焰还要轻。当火焰熄灭了、当纸只剩下一撮黑灰的时候，它们还在灰上跳了一次舞。

它们在它们所接触过的地方都留下了痕迹——许多小小的红火星。孩子们都从学校里走出来，老师总是跟在最后！看看这情形真好玩！家里的孩子站在死灰的周围，唱出一支歌——

吱——格——嘘，

拍——呼——吁！

歌儿完了！

不过那些细小的、看不见的小生物都说：“歌儿是永远不会完的！这是一切歌中最好的一支歌！我知道这一点，因此我是最幸福的！”

但是孩子们既听不见，也不懂这话；事实上他们也不应该懂，因为孩子不应该什么东西都知道呀。

## 枞树（上）
树林深处，长着一棵很漂亮的小枞树。这是一个开阔的好地方，可以得到温暖的阳光和新鲜的空气。然而小枞树觉得不快活，它只希望和它周围那些伙伴大松树和大枞树一样高。太阳照耀着，微风吹拂它的叶子，农家小孩子叽叽喳喳地走过，但是小枞树不理他们。有时候孩子们拿来一大篮用草扎着的紫莓和草莓，靠近小枞树坐下，说：“这不是一棵很漂亮的小枞树吗？”这就使它更不高兴了。

不过这棵枞树一直在一年长高一节，因为看枞树树干上有多少节就可以知道它有多少岁。只是尽管在长大，它还是抱怨说：“噢，我多么希望我和其他的树一样高啊，这样我就可以把我的树枝伸到四面八方，我的树顶也可以眺望广阔的世界。鸟将在我的树枝上筑窠，风一吹，我就能像我那些高大的伙伴一样神气地弯弯腰了。”

这棵枞树是如此的不满足，它对着温暖的阳光、小鸟或者早晚飘在它上空的玫瑰色云彩，一点儿不觉得快乐。

冬天到了，雪地白得闪烁。一只野兔蹦蹦跳跳着跑过来，正好在这棵小枞树上跳过去；这会儿小枞树感到多么失面子！两个冬天过去了，当第三个冬天到来的时候，这棵枞树已经长得那么高，野兔只好绕过它跑。但是它仍然不满意，说：“噢，但愿我能继续长得又高又大！世界上再没有别的事值得关心！”

秋天，就如一向那样，伐木人来了，砍下了几棵最高的树，当这些大树吧嗒一声倒在地上的时候，如今已经长得足够高的年轻枞树不禁浑身一震。在把那些树的树枝砍掉以后，它们的树干看上去那么瘦长，光秃秃的，简直认不出它们来了。接着它们被放上车子，由马拉出树林。

“它们要上哪儿去啊？它们会变成什么呢？”年轻的枞树很想知道。

因此到了春天，当燕子和鹳鸟飞来的时候，小枞树问它们说：“你们知道那些树被送到什么地方去了吗？你们碰到过它们吗？”

燕子什么也不知道，但是鹳鸟想了一下，点点头说：“是的，我想我碰到过。我从埃及飞到这里来的时候，遇到了几艘新船，它们有漂亮的桅杆，闻上去像是枞树味。我想这些桅杆原先一定是那些树；我对你说实在的，它们非常宏伟，非常宏伟。”

“噢，我多么希望高得可以变成桅杆出海啊。”枞树说，“海是什么？它是什么样子的？”

“解释起来太花时间了。”鹳鸟说着，很快地飞走了。

“为你的青春感到欢乐吧，”太阳光说，“享受你蓬勃的生长吧，享受你身上的年轻生命吧。”

风亲吻这棵树，露水用泪珠湿润它的身体。但是枞树一点不看重这些。

圣诞节临近了，许多年轻枞树被砍倒，其中有一些，比这棵既不欣赏休息又不欣赏平静，却只渴望着离开它的树林老家的枞树甚至更小更年轻。这些由于长得好看而被选中的枞树保留着它们的树枝，也被装上车子，由马拉出了树林。

“它们要去什么地方啊？”枞树问道，“它们不比我高，有一棵实在比我小多了；为什么不把它们的树枝砍掉呢？它们要去什么地方啊？”

“我们知道，我们知道。”麻雀们唱起来，“我们在城里的房子窗口往里面看，我们知道它们做了什么。它们被打扮得再华丽不过。我们看到它们站在温暖的房间当中，装饰着各种美丽的东西——蜜糖饼、涂金的苹果、玩具和千百支小蜡烛。”

“接下来呢？”枞树透过它所有的树枝发起抖来，“接下来怎样了？”

“我们没有再看下去。”麻雀们说，“不过我们看到这些就足够了。”

“我不知道这样美好的事会不会落到我头上，”枞树想，“这要比漂洋过海好多了。我想这件事几乎想得心都痛起来。噢，圣诞节什么时候来啊？我已经长得和去年被砍走的那些树一样高一样好。噢，我现在能被放到车上，或者站在温暖的房间里，周身灯火灿烂、富丽堂皇就好了！接下来一定还会有更好更美的事情，否则不会把树装饰打扮成这样的。没错，接下来的事情一定更加宏伟，更加辉煌。那会是什么事情呢？我渴望得都难受死了。我的感觉我简直说不出来。”

“和我们一起欢乐吧，”空气和阳光说，“在新鲜空气中享受你自己的光辉生活吧。”

但是枞树欢乐不起来，虽然它一天比一天长得高。冬天和夏天，在树林中可以看到它深绿色的叶丛，人们走过时不由得说：“一棵多么美丽的树啊！”

又到了一个圣诞节，这棵不满足的枞树第一个倒下来。当斧头砍进树干，把树心砍断时，树呻吟一声倒在地上，只觉得疼痛和软弱无力，忘掉了它所有对幸福的向往，难过地离开了树林老家。它知道它永远不会再看到它那些亲爱的老伙伴，那些树，也不会再看到长在它身边的那些矮树丛和五颜六色的花了；也许连那些小鸟也不会再见到了。而且路上也一点不快活。

直到和其他几棵树一起被卸在一座房子的院子里时，枞树才清醒过来。它听见一个男人说：“我们只要一棵，这一棵是最美丽的。”

## 枞树（中）
接着来了两个穿华美制服的仆人，他们把这棵枞树搬进一个美丽的大房间。墙上挂着画，靠近大火炉摆着一些大瓷瓶，瓶盖上画着狮子。房间里有摇椅、绸沙发、大桌子，这些桌子上放满了图画、书籍和值很多钱的玩具——至少孩子们是这样说的。接下来这棵枞树被放进一个堆满了沙的大木桶，但是木桶周围蒙着厚呢子，这样就没有人看得出这是一个木桶了，它被放到一块非常美丽的地毯上。

枞树哆嗦得多么厉害啊！现在它会遭遇什么事情呢？几位年轻小姐走来，一些仆人帮助她们装饰这棵树。在一根树枝上，她们挂上一些用彩纸剪成的小袋子，每个袋子里装满了糖果。其他那些树枝挂上涂金的苹果和核桃，它们就像是长在这棵树上似的。在上面，树的四面八方是千百支红的、蓝的和白的小蜡烛，都扎在树枝上。像真的婴儿那样的玩偶被放在绿叶下——这棵树以前还从来没有见过这样的东西——在树顶上拴着一颗金锡纸做的闪亮星星。噢，它太美丽了！

“今天晚上，”她们都说，“它将会多么明亮啊！”

“噢，只等天一黑，”枞树想，“这些蜡烛就要点起来！接下来我就可以知道还将发生什么事情了。树林里那些树会来看我吗？不知道那些麻雀飞过的时候会不会在窗口朝里面看？我在这里将长得更快，夏天和冬天都保存着这些装饰品吗？”

但是苦苦猜想也没有用，这只会使它的树皮发痛。对于一棵细长的枞树来说，这种痛就有如我们的头痛。

最后小蜡烛点亮了。于是这棵树发出闪亮耀眼的光！它高兴得每一根树枝都在发抖，以致一支蜡烛落到了绿叶丛中，烧掉了几片叶子。

“救命啊！救命啊！”那些年轻小姐叫起来，但是没什么，因为她们很快就把火扑灭了。

在这以后，枞树连发抖都不敢了，尽管火使它害怕；它竭力不要损坏任何美丽的装饰品，哪怕它们亮得使它头昏眼花。现在两扇门打开了，一大群孩子冲进来，像是要把这棵树推倒似的；他们后面跟着比较安静的大人。小家伙们惊愕地一声不响地站了一会儿，接着他们又高兴得大喊大叫，直到房间里隆隆震响。他们绕着树快活地跳舞，树上的礼物被一件接一件拿走。

“他们在干什么？接下来会发生什么事呢？”枞树想。

最后蜡烛烧到了树枝，被弄熄了。接着孩子们得到允许拿走这棵树上的东西。

噢，他们是怎样地向它直冲过来啊，又是拉又是扯，一直到树枝都折裂了，如果不是用那颗闪亮的星拴住天花板，枞树一定已经被他们推倒。接下来孩子们拿着他们的漂亮玩具跳着舞，没有人再理会枞树，除了孩子们的女仆，她进来后在树枝之间窥望，看是不是还有个苹果或者无花果被漏掉。

“讲故事，讲故事。”孩子们叫着把一个小胖老人向枞树这边拉过来。

“现在我们都在绿荫里，”老人在树下坐下来说，“这棵树也可以高兴地听到这个故事。不过我只讲一个，讲什么呢？讲伊维德-阿维德，还是讲那个‘咕噜噜转的泥球’呢？他滚下楼梯，不过很快又站起身，最后娶了一位公主。”

“讲伊维德-阿维德。”一些孩子大叫。“讲‘咕噜噜转的泥球’。”另一些孩子大叫，真是叫得震天响。

但是枞树一声不响，心里在想：“这一切有我的事吗？”不过它已经使他们尽情地得到快乐了。

接着老人给他们讲那个“咕噜噜转的泥球”的故事，泥球怎样滚下楼梯又站起身，娶到了一位公主。孩子们拍手大叫：“再讲另一个，再讲另一个。”因为他们也要听“伊维德-阿维德”的故事，却只听了“咕噜噜转的泥球”的故事。

这一下枞树就完全安静下来，陷入沉思；树林里的小鸟从来没有讲过这样的故事，什么“咕噜噜转的泥球”滚下楼梯，却还娶了一位公主。

“啊！对，世界上就发生这样的事。”枞树想，它全相信，因为这个故事是这么一位好先生讲的。“啊！好吧，”它想，“谁知道呢？也许我也能在倒下之后娶上一位公主。”它快活地等候下一个晚上，希望身上再次装饰上烛光和玩具、金锡纸和水果。

“明天我绝不会发抖了，”它想，“我要享受我的全部荣华，并重新听到那个‘咕噜噜转的泥球’的故事，也许还有‘伊维德-阿维德’的故事。”枞树一声不响，沉思了一整夜。

早晨，仆人和侍女来了。

“现在，”枞树想，“我又要全身漂亮起来了。”

但是他们把它拖出房间，拖到楼上的顶楼里，把它扔在一个阳光照不到的黑暗角落的地板上，然后离开它走了。

“这是怎么回事啊？”枞树想，“我在这里干什么？在这样的地方我什么也听不见。”

它思考的工夫有的是，因为一个个白天黑夜过去，没有一个人走近它，即使终于有人来，也只是把一些大箱子扔到角落里。因此枞树被遮得完全看不见了，就像它从来不曾存在过一样。

“如今是冬天，”枞树想，“地很硬，还盖满了雪，因此人们不能栽种我，我敢说，我将要在这里一直待到来年春天。每个人都为我考虑得多么周到，对我多么好啊！不过我仍然希望这地方别这么黑，也不要这么寂寞，连一只小野兔也看不到。在树林里是多么快乐啊，雪盖着大地，野兔跑过，对，甚至在我的头顶上跳过去，虽然那会儿我实在不高兴这件事。噢，在这里太孤独太寂寞了。”

## 枞树（下）
“叽，叽。”一只小老鼠叫着，小心地向枞树爬过来，接着又来了一只，它们两个用鼻子嗅枞树，又在树枝中间爬行。

“噢，冷极了，”小老鼠说，“要不然待在这里倒挺舒服的，对吗？

你这老枞树。”

“我不老，”枞树说，“比我老的多的是。”

“你是从哪里来的？你知道些什么呢？”两只充满好奇心的老鼠问道，“你见过世界上最美丽的地方吗？能把它们都告诉我们吗？你到过储藏室没有？那里干酪放在架子上，火腿吊在天花板下面，还可以在脂油蜡烛上跑来跑去，瘦着进去胖了出来。”

“对那地方我一无所知，”枞树说，“但是我知道树林，那里太阳照耀，小鸟唱歌。”于是枞树给两只小老鼠讲它的少年时代。

两只小老鼠一辈子没听说过这样的事，它们仔细听完以后说：“你见过多少东西啊！你一定非常快活。”

“快活！”枞树叫起来。但是想到了它给它们讲的事情，它承认说：“啊，不错！那些到底是快活的日子。”它继续讲下去，讲到圣诞节前夜所有的事，讲到它全身挂满了糕饼和蜡烛。

两只老鼠叹气说：“噢，你是多么幸运啊，你这老枞树。”

“我根本不老，”枞树回答说，“我这个冬天才从树林里来到这里的，而且如今不再长大了。”

“你会讲多么好听的故事啊！”两只小老鼠说。第二天夜里，又有四只老鼠跟着它们一起来听枞树讲故事。

它越是讲，记起的事情也越是多，这时候它心里说：“那些都是快活的日子，但是它们可能还会来的。那个‘咕噜噜转的泥球’掉下楼梯，然后他娶到了公主，说不定我也能娶上个公主。”

枞树不禁想到树林里那棵漂亮的小桦树，对它来说，这是一位真正的美丽公主。

“‘咕噜噜转的泥球’是谁？”那些小老鼠问道。

于是枞树把整个故事原原本本地讲给它们听，每个字它都记得。

那些小老鼠太喜欢这个故事了，简直要跳到树顶上。第二天夜里，来了更多的小老鼠，到了星期日，两只大老鼠也和它们一起来了，但是它们说这根本不是一个美丽的故事，小老鼠们也觉得很懊恼，因为这使它们也对故事不那么感兴趣了。

“你只知道一个故事吗？”两只大老鼠问道。

“只知道一个，”枞树回答，“我是在我一生当中最幸福的那个晚上听到的。但是当时我并不知道我是那么幸福。”

“我们觉得这是一个十分蹩脚的故事。”大老鼠们说，“你不知道关于储藏室里的熏肉或者小蜡烛的故事吗？”

“不知道。”枞树回答说。

“那么多谢你了。”大老鼠们回答着，跑掉了。

这以后，小老鼠们也不来了。枞树叹气说：“当那些快活的小老鼠围着我，坐在那里听我讲话的时候，我是非常愉快的。现在这也全过去了。不过只要有人来把我带出这个地方，我会认为自己是幸福的。”小枞树咕哝说，“我不知道这一天什么时候到。”

是的，有一天早晨它终于到了。人们上来清理顶楼，箱子都被搬开，枞树被拖出来，重手重脚地扔在地板上，接着仆人把它拖到外面阳光照到的楼梯口。“现在生活又开始了。”枞树接触到阳光和新鲜空气时高兴非凡地说道。接着它被搬下楼拿到院子里，快乐得它都忘记了想自己的事，只顾着东张西望，要看的东西太多了。院子靠近花园，花园里所有的花看上去都在盛开，鲜艳芳香的玫瑰花悬在小栅栏上面。椴树在开花，燕子飞来飞去叫着：“叽叽，叽叽，叽叽，我的伙伴来了。”不过它们说的不是枞树。

“现在我要生活了。”枞树叫着，快活地张开它的树枝。但是天哪，它们全都枯萎发黄了！它就这样躺在角落里的野草和荆棘丛中。

金锡纸剪成的星星仍旧粘在树顶上，在阳光中闪闪发亮。

就在这院子里有两个孩子在玩，他们曾经绕着圣诞树跳过舞，曾经那么快活。小的一个看到了那颗金星，跑过来把它从树上扯下来。

“瞧这棵难看的老枞树上粘着个什么？”那孩子说着踩踏树枝，踩得它们在他的靴子底下毕毕剥剥地折断。

枞树看看花园里所有鲜艳的花，再看看自己，恨不得仍旧留在顶楼黑暗的角落里。它想到自己在树林里的青春年华，想到快活的圣诞之夜，想到倾听它讲“咕噜噜转的泥球”故事的那些小老鼠。

“过去了！过去了！”老枞树说，“噢，在我能享受我自己的生活时好好享受就好了！但现在已经太晚了。”

接着一个小伙子走来，把枞树劈成许多小木柴，最后它们在地上成了一大捆。木柴被塞到大锅底下的火里，它们很快就熊熊燃烧起来。这时候枞树那么深地叹息，每一声叹息就像一声枪响。接着正在玩的孩子们走来坐在火前，看着火叫道：“噗，噗。”但是随着每一声“噗”——那是深深的叹息声——枞树正在想着树林里一个夏天的日子，想着圣诞节之夜，想到最后它完全烧成了灰。

孩子们仍旧回到了院子里去玩，最小的一个把那颗金星戴在胸前，在枞树一生中最幸福的晚上，这颗金星曾经装饰在它的树顶上。

现在一切都完了，枞树的生命完了，这故事也完了——因为一切故事最后都是要完的。
