# 丑小鸭

## 1. 丑小鸭（上）

乡下真是非常美丽。现在正是夏天，小麦是金黄的，燕麦是绿油油的，干草在绿色的牧场上堆成垛。鹳鸟迈着又长又红的腿在散步，喋喋不休地讲着埃及话，这是他从妈妈那儿学到的一种语言。田野和牧场的周围有些大森林，森林里有些很深的池塘。的确，乡间是非常美丽的。太阳光正照着一幢老式的房子，房子周围有几条很深的小溪。大棵的牛蒡从墙角一直长到小溪边。它们长得非常高，小孩子甚至可以直着腰站在下面，想象自己是在最浓密的森林里。牛蒡下面有一只母鸭坐在窠里孵小鸭，这时她已经累坏了，还好来看她的客人不多。别的鸭子都愿意在溪流里游来游去，而不愿意跑到牛蒡下面来和她聊天。

最后，那些鸭蛋终于一个接一个地裂开了。“噼！噼！”蛋壳响起来。所有的蛋黄现在都变成了小动物。小鸭子们把头从蛋壳里伸出来。“嘎！嘎！”母鸭说。他们也就跟着嘎嘎地大声叫起来。他们在绿叶下面向四周看。妈妈让他们尽量东张西望，因为绿色对他们的眼睛有好处。

“这个世界真大啊！”这些年轻的小家伙说。的确，比起他们在蛋壳里的时候，他们现在的世界真是大不相同了。

“你们以为这就是整个世界吗？世界比你们看到的大多了，它伸展到花园的另一边，一直伸展到田里去。那才远呢！连我都没有去过！我想你们应该全都出来了吧？”她一边说一边站起来，“我还没有把你们都生出来！这只最大的蛋还躺着没有动静。它还得躺多久呢？我真是有些烦了。”于是她又坐下来。

“这只最大的蛋为什么还没有动静？这太不寻常了。它一定有什么特别之处。”

“怎么样了？”一只来拜访她的老鸭子问。

“这个蛋费的时间真久！”坐着的母鸭说，“它老是不裂开。请你看看别的吧。他们真是一些惹人爱的小鸭，都像他们的爸爸。这个坏东西从来没有来看过我一次！”

“让我瞧瞧这个老是不裂开的蛋吧。”这位年老的客人说，“请相信我，这是一只吐绶鸡的蛋。有一次我也同样受过骗：你知道，那些小家伙不知道给我增加了多少麻烦和苦恼，因为他们都不敢下水。我根本没有办法叫他们在水里试一试。我好说歹说，一点儿用也没有！让我来瞧瞧这只蛋吧。哎呀！这是一只吐绶鸡的蛋！让它躺着吧，你尽管去教别的孩子游泳好了。”

“我还是在它上面多坐一会儿吧。”鸭妈妈说，“我已经坐了这么久了，就是再坐一个星期也没有关系。”

“那么就请便吧。”老鸭子说完就告辞了。

“噼！噼！”最后这只大蛋终于裂开了。新生的这个小家伙又大又丑，边叫边向外面爬。鸭妈妈瞅了他一眼，说：“这只小鸭子简直大得吓人，别的没有一只像他这样，但是他一点儿也不像小吐绶鸡！好吧，我们来试试看吧。他得到水里去，我踢也要把他踢下水去。”

第二天，天气又晴朗又美丽。太阳照在牛蒡上。鸭妈妈带着她所有的孩子走到溪边。她自己“扑通”一声跳进水里去了。“嘎！嘎！”她在水里招呼着，于是小鸭子就一个接一个跳下水去。水淹过了他们的头顶，但是他们马上又冒出了水面，小腿很灵活地划着，他们游得非常漂亮。他们全都在水里，连那个丑陋的灰色小家伙也跟他们在一起游。

“他不是一只吐绶鸡。”鸭妈妈说，“你看他划得多灵活，浮得多么稳！他是我的亲生孩子！如果你仔细看一看，他长得还算蛮漂亮呢。嘎！嘎！跟我一块儿来吧，我把你们带到那个养鸡场里看看。不过，你们得紧跟着我，免得别人踩着你们。你们还得当心猫呢！”

当他们来到养鸡场的时候，那里响起了一阵可怕的喧闹声。因为有两个鸭子家族正在争夺一个鳝鱼头，结果猫却把它抢走了。

“你们瞧，世界就是这个样子！”鸭妈妈流着口水说，因为她也想吃那个鳝鱼头。“现在迈开你们的腿吧！”她说，“拿出精神来！如果看到那儿的一只老母鸭，你们就得对她鞠躬，因为她是这儿最有声望的人物。她有西班牙血统，因为她长得非常胖。你们看，她的腿上有一块红布条。这是一件非常了不起的东西，也是一只鸭子所能得到的最大光荣。这块红布条说明人们不愿意失去她，动物和人都认识她。现在打起精神来吧，不要把腿缩进去。一只有教养的鸭子总是把腿摆开的，就像他们的爸爸妈妈，像我这样。现在鞠躬，说一声‘嘎嘎’！”

他们这样做了。别的鸭子站在旁边看着，同时用相当大的声音说：“瞧！现在又来了一批找东西吃的客人，好像我们的数量还不够多似的！瞧那只小鸭的一副丑相！我们真看不惯！”于是马上有一只鸭子飞过去，在他的脖颈上啄了一下。

“请你们不要欺负他，”妈妈说，“他没有伤害谁啊！”

“对，不过他长得太大太丑了，”啄过他的那只鸭子说，“因此他必须挨打！”

“那只母鸭其他的孩子都很漂亮，”腿上有一块红布条的那只老母鸭说，“只有这只是例外，真是可惜。我希望他妈妈能把他再孵一次。”

“这可不能，太太。”鸭妈妈回答说，“他虽然不好看，但是他的脾气非常好。他游起水来也不比别的差，甚至可以说游得比别的还好呢。我想他会慢慢变漂亮的，或者到适当的时候，他也可能会变小一点儿。他在蛋里待得太久了，因此他的模样有点儿不太自然。”接着她在他的脖颈上啄了一下，把他的羽毛理了一理，说：“他还是一只公鸭呢，所以关系也不太大。我想他的身体很结实，将来总会自己找到出路的。”

“别的小鸭倒很可爱。”老母鸭说，“你在这儿不要客气。如果你找到鳝鱼头，请把它送给我好了。”

于是他们在这里安顿下来，就像在自己家里一样。不过最后从蛋壳里爬出的那只小鸭太丑了，到处挨打，被排挤，被讥笑，不仅在鸭群中是这样，连在鸡群中也是这样。

“他真是又大又丑！”大家都说。有一只雄吐绶鸡生下来脚上就有距，因此他自以为是一个皇帝。他像一条鼓满了风的帆船，气势汹汹地向丑小鸭走来，瞪着一双大眼睛，脸涨得通红。这只可怜的小鸭不知道躲到什么地方去才好，只觉得非常悲哀，因为自己长得那么丑陋，而且成了全体鸡鸭的嘲笑对象。

这是第一天的情形，后来一天比一天糟。大家都要赶走这只可怜的小鸭，连他自己的兄弟姐妹也对他生起气来。他们老是说：“你这个丑八怪，希望猫把你抓去才好！”于是妈妈也说：“我希望你走远些！”鸭儿们啄他，小鸡们打他，喂鸡鸭的那个女佣人用脚踢他。

于是他飞过篱笆逃走了。灌木林里的小鸟一见到他，就惊慌地向空中飞去。

“这是因为我太丑了！”小鸭想。于是他闭起眼睛继续往前跑，一口气跑到一片住着野鸭的沼泽地里。他在这儿躺了一整夜，因为他非常疲乏和沮丧。

天亮的时候，野鸭都醒了，他们瞧了瞧这位新来的朋友。

“你是谁啊？”他们问。小鸭一下转向这边，一下转向那边，尽量对大家恭恭敬敬地行礼。

“你真是丑得厉害，”野鸭们说，“不过只要你不跟我们族里任何鸭子结婚，和我们倒也没有什么大的关系。”可怜的小东西！他根本没有想到什么结婚，他只希望人家准许他躺在芦苇里，喝点沼泽里的水就够了。

他在那儿躺了整整两天。后来有两只大雁，准确地说，应该说是两只公雁，飞来了。他们从蛋壳里爬出来还没有多久，非常顽皮。

“听着，朋友！”他们说，“你丑得可爱，连我们都禁不住要喜欢你了。你做一只候鸟，跟我们一块儿飞走好吗？有一块沼泽地离这儿很近，那里有好几只活泼可爱的大雁，她们都是姑娘。你虽然很丑，但是可以在她们那儿碰碰运气。”

“噼！啪！”天空中突然发出一阵响声，这两只公雁落到芦苇里死了，把水染得鲜红。

“噼！啪！”又是一阵响声。整群的大雁都从芦苇里飞起来。于是又一阵枪声响起来了。原来有人在大规模地打猎。猎人都埋伏在这片沼泽地的周围，有几个人甚至坐在伸到沼泽地上空的树枝上。枪管冒出的蓝烟像云雾似的笼罩着这些树，慢慢地在水面上飘着。

猎人来打猎了，弱小无助的丑小鸭躲不过去了吧？

这时，猎狗都从泥泞里跑过来，灯心草和芦苇向两边倒去。这对于可怜的小鸭来说真是件可怕的事情！他把头掉过来，藏在翅膀里。就在这个时候，一只骇人的大猎狗出现在小鸭的身边。他的舌头从嘴里伸出来，伸得很长，眼睛里发出丑恶和可怕的光。他把鼻子顶到小鸭的身上，露出了尖牙齿，但他突然又跑开了，没有把小鸭抓走。

“啊，谢谢老天爷！”小鸭叹了一口气，“我丑得连猎狗也不要咬我。”

他安静地躺下来。枪声还在芦苇里响着，枪弹一发接一发地射出来。

天很晚的时候，四周才安静下来，可是这只可怜的小鸭还不敢站起来。他又等了好几个小时，才敢向四周望一眼。于是他急忙跑出这块沼泽地，拼命地跑，向田野上跑，向牧场上跑。这时忽然吹起一阵狂风，让他跑起来非常困难。

## 2. 丑小鸭（下）

到天黑的时候，他来到一个简陋的农家小屋前。小屋那么残破，甚至不知道应该向哪一边倒才好。因此它也就没有倒。狂风在小鸭身边呼号，叫得非常厉害，他只好坐下来。可是风越吹越厉害，还好，小鸭看到小屋门上有一个铰链已经松了，门也歪了，可以从空隙钻进屋子里去，于是他便钻进去了。

屋子里有一个老太婆和她的猫，还有一只母鸡。她把这只猫叫作“小儿子”。这只猫能把背拱得很高，发出咪咪的叫声；他的身上还能迸出火花，不过要他这样做，你就得倒摸他的毛。那只母鸡的腿又短又小，因此叫她“短腿鸡”。她生下的蛋很好，所以老太婆把她爱得像自己的亲生孩子一样。

第二天早晨，大家马上注意到了这只来历不明的小鸭。那只猫开始咪咪地叫，那只母鸡也咯咯地喊起来。

“这是怎么一回事？”老太婆说，同时朝四周看。不过她的眼睛有点儿花，所以她以为小鸭是一只肥鸭，走错了路，才跑到这儿来了。“这真是少有的运气！”她说，“现在我可以有鸭蛋了。希望他不是一只公鸭！我们得弄个清楚！”

于是小鸭就在这里接受了一个星期的考验，可是他什么蛋也没有生下来。

那只猫是这家的绅士，那只母鸡是这家的太太，所以他们一开口就说：“我们和这世界！”因为他们以为他们自己就是半个世界，而且还是最好的那一半呢。小鸭觉得自己可以有不同的看法，但是母鸡却忍受不了他的这种态度。

“你能下蛋吗？”她问。

“不能！”

“那么就请你不要发表意见。”

雄猫问：“你能拱起背，发出咪咪的叫声和迸出火花吗？”

“不能！”

“那么，当聪明人在讲话的时候，你就没有必要发表意见！”

小鸭坐在一个墙角里，心情非常不好。这时他想起了新鲜的空气和阳光。他突然有一种奇怪的渴望：到水里去游泳。最后他实在忍不住了，就把心事对母鸡说了出来。

“你在想什么？”母鸡问，“你没有事情可干，所以你才有这些怪念头。你只要生几个蛋，或者咪咪地叫几声，那么你这些怪念头就会没有了。”

“不过，在水里游泳是多么痛快啊！”小鸭说，“往水底一钻，让水淹在你的头上，那是多么痛快啊！”

“是的，那一定很痛快！”母鸡说，“你简直在发疯。你去问问猫吧，在我所认识的一切朋友当中，他是最聪明的。你去问问他，喜欢不喜欢在水里游泳，或者钻进水里。我先不讲我自己。或者你去问问你的主人，那个老太婆吧，世界上再也没有比她更聪明的人了！你以为她想去游泳，让水没过她的头顶吗？”

“你们不了解我。”小鸭说。

“我们不了解你？那请问谁了解你呢？你绝不会比猫和女主人更聪明吧，我先不提我自己。孩子，你不要自以为是！你现在得到这些照顾，应该感谢上天。你现在来到一个湿暖的屋子里，有了一些朋友，而且还可以向他们学习很多的东西，不是吗？不过你是一个废物，跟你在一起真不痛快。相信我的话吧，我现在对你说这些不好听的话，完全是为了帮助你。只有这样，你才知道谁是你真正的朋友！请你注意学习生蛋，或者咪咪地叫，或者迸出火花吧！”

“我想我还是重新回到外面的世界去吧。”小鸭说。

“好吧，你去吧！”母鸡说。

于是小鸭离开了。他很快找到一片湖水，一会儿在水上游，一会儿钻进水里。不过，因为他的样子丑，所有的动物都瞧不起他。

秋天到了。树林里的叶子变成了黄色和棕色，风卷起它们在空中飞舞。载着冰雹和雪花的云块低悬在空中。乌鸦站在篱笆上，冻得直叫唤。是的，你只要想想这情景，就会觉得冷得发抖了。这只可怜的小鸭的确没有舒服的时候。

一天傍晚，当太阳正在缓缓下落的时候，一群漂亮的大鸟从灌木林里飞出来。小鸭从来没有看到过这样美丽的鸟。他们白得发亮，颈项又长又柔软，这就是天鹅。他们发出一种奇异的叫声，展开美丽的长翅膀，从寒冷的地带飞向温暖的国度。他们越飞越高，丑小鸭不禁感到一种说不出的兴奋。他向他们伸长了脖子，在水面上像一个车轮似的不停地旋转，发出一种连他自己也害怕的响亮的叫声。

啊！他再也忘不了这些美丽的鸟儿，这些幸福的鸟儿。当他看不见他们的时候，就沉入水底，但是当他再冒到水面上来的时候，却感到非常空虚。他不知道这些鸟儿的名字，也不知道他们要向什么地方飞去。不过他爱他们，好像他从来还没有过这样的感觉。他并不嫉妒他们，他怎能梦想有他们那样的美丽呢？只要别的鸭子准许他跟他们生活在一起，他已经很满意了，可怜的丑东西。

冬天越来越冷了，小鸭不得不在水上游来游去，免得水面完全冻结成冰。不过他游动的范围一天比一天小，最后他终于筋疲力尽了，躺在那里一动也不动，他很快就被冰冻住了。

丑小鸭一定会被冻死，除非有人来救他。

一天清早，有一个农民从这儿经过。他看到了这只小鸭，就走过去用木屐把冰块踏破，然后把他抱回来送给他的妻儿。这时丑小鸭才渐渐地恢复了知觉。

小孩子们都想跟他玩，不过小鸭以为他们想要伤害他。他一害怕就跳到牛奶盘里去了，把牛奶溅得满屋子都是。女人惊叫起来，拍着双手。这么一来，小鸭就飞到黄油盆里去了，然后飞进面粉桶里去了，最后才爬出来。这时他的样子才好看呢！女人尖声地叫起来，拿着火钳要打他。小孩们挤做一团，想抓住这只小鸭。他们又是笑，又是叫！幸好大门是开着的。他钻进灌木林中新下的雪里面去，躺在那儿，几乎要昏倒了。

要是只讲他在这严冬所受的困苦和灾难，那么这个故事也就太悲惨了。当太阳又开始温暖地照着大地的时候，他正躺在沼泽地的芦苇里。百灵鸟唱起歌来了，这是一个美丽的春天。

忽然间他举起翅膀，翅膀拍起来比以前有力得多，马上就把他托起来飞走了。他不知不觉地已经飞进了一座大花园。这儿苹果树正开着花，紫丁香在散发着香气，又长又绿的枝条垂到弯弯曲曲的溪流上。啊，这儿美丽极了，充满了春天的气息！三只美丽的白天鹅从树荫里一直游到他面前来。他们轻柔地浮在水面上，羽毛发出沙沙的响声。小鸭认出这些美丽的动物，于是心里感到一种说不出的难过。

“我要飞向他们，飞向这些高贵的鸟儿！可能他们会把我弄死，因为我是这样丑，居然敢接近他们。不过这没有什么关系！被他们杀死总要比被鸭子咬，被鸡群啄，被看管养鸡场的那个女佣踢和在冬天受苦好得多！”

于是他飞到水里，向这些美丽的天鹅游去。这些动物看到他，马上就竖起羽毛向他游来。

“请你们弄死我吧！”这只可怜的动物说。他把头低低地垂到水上，只等待着死亡。但是他在这清澈的水面上看到了什么呢？他看到了自己的倒影，那不再是一只粗笨的、深灰色的、又丑又令人讨厌的鸭子，而是一只天鹅！

只要你曾经在一只天鹅蛋里待过，就算你生在养鸭场里也没有什么关系。

他曾经受过那么多的不幸和苦难，可是现在感到非常高兴。他清楚地认识到幸福和美好正在向他招手。许多大天鹅在他周围游泳，用嘴亲他。

花园里来了几个小孩子，他们向水上抛来许多面包屑和麦粒。最小的那个孩子喊道：“你们看那只新天鹅！”别的孩子也兴高采烈地叫起来：“是的，又来了一只新的天鹅！”于是他们拍着手，向他们的爸爸妈妈跑去，接着抛了更多的面包屑和小糕饼到水里。

大家都说：“新来的这只最美！那么年轻，那么好看！”那些老天鹅不禁在他面前低下头来。

他感到非常难为情。他把头藏到翅膀里面去，不知道怎么办才好。他感到太幸福了，但他一点儿也不骄傲，因为一颗善良的心是永远不会骄傲的。他想起他曾经怎样被人迫害和讥笑过；而现在大家都说他是最美丽的一只鸟儿。紫丁香在他面前把枝条垂到水里去。太阳照得让人感到很温暖，很愉快。他扇动着翅膀，伸直细长的颈项，从内心里发出一个快乐的声音：“当我还是一只丑小鸭的时候，我做梦也没有想到会有这么多的幸福！”

# 拇指姑娘

## 3. 拇指姑娘（上）

从前有一个女人，她非常希望有一个孩子，但是她一直没有实现自己的愿望。于是她就去请教一个巫婆。她对巫婆说：“我非常想有一个小小的孩子！您能告诉我怎么可以得到吗？”

“这容易得很！”巫婆说，“你把这颗大麦粒拿去吧。它可不是长在乡下田里的那种大麦粒，也不是鸡吃的那种大麦粒。你把它埋在一个花盆里，不久你就可以看到你想要的东西了。”

“谢谢您。”女人说。她给了巫婆三个银币，回到家里种下那颗大麦粒。不久，一朵美丽的大红花长出来了。它看起来很像郁金香，不过花瓣紧紧地包在一起，好像还是一个花苞。

“这是一朵很美的花。”女人说着，在那黄里带红的花瓣上吻了一下。花儿忽然“噼啪”一声开放了。原来这是一朵真正的郁金香。在花的正中央，在绿色的花蕊上，坐着一位娇小的姑娘。她看起来又白嫩又可爱，还没有大拇指的一半长，因此人们就把她叫做拇指姑娘。

拇指姑娘的摇篮是一个漂亮的胡桃壳，垫子是蓝色紫罗兰的花瓣，被子是玫瑰花瓣。白天，她在桌子上玩耍。女人在桌上放一个盛水的盘子，盘子周围摆着一圈花，水上浮着一片很大的郁金香花瓣。拇指姑娘坐在花瓣上，用两根白马尾当桨，从盘子的一边划到另一边。她还会唱歌，而且唱得那么温柔甜蜜，从来没有人听到过这样美妙的歌声。

一天晚上，拇指姑娘正在漂亮的小床上睡觉，一只又丑又大的癞蛤蟆从破窗子跳了进来。她一直跳到桌上，看见睡在红玫瑰花瓣下面的拇指姑娘。

“这姑娘可以做我儿子的漂亮妻子。”癞蛤蟆说。于是她抓起拇指姑娘睡着的胡桃壳，背着它跳出窗子，一直跳到花园里。

花园里有一条很宽的小溪，癞蛤蟆和她的儿子就住在又低又潮湿的岸边。她的儿子跟妈妈简直一模一样，也长得奇丑无比。他看到胡桃壳里的美丽姑娘，只会叫：“阁阁！阁阁！蹚！蹚！蹚！”

“说话不要那么大声，要不就把她吵醒了。”老癞蛤蟆说，“她轻得像一片天鹅的羽毛，还可能从我们这儿逃走。我们得把她放在溪里一片宽大的睡莲叶子上。她这么娇小轻巧，那片叶子对她来说就像一个岛，她没有办法逃走。我们趁这时候把泥底下的房子修好，让你们以后住在那儿。”

老癞蛤蟆游到溪水中央最大的一片睡莲叶子旁，把胡桃壳和睡在里面的拇指姑娘放在叶子上。

第二天清早，可怜的小姑娘醒来了。她看见宽大的绿叶四周全是水，自己一点儿办法也没有回到陆地上，便伤心地哭起来。

老癞蛤蟆在泥里用灯芯草和黄睡莲装饰好房间，随后和她的丑儿子游到拇指姑娘的叶子旁。他们想先把她美丽的小床搬到洞房里去。老癞蛤蟆在水里向她深深鞠了一躬，说：“这是我的儿子，他就是你未来的丈夫。你们会在泥巴里生活得很幸福。”

“蹚！蹚！蹚！”这位少爷只会说这一句话。

他们搬着漂亮的小床游走了。拇指姑娘独自坐在绿叶上大哭。她既不愿意跟讨厌的癞蛤蟆住在一起，也不愿意让那个丑少爷做自己的丈夫。

水里的小鱼听到了癞蛤蟆的话，都伸出头来瞧这个小姑娘。它们一看到她，就觉得她非常美丽，也非常同情她。这样一位美丽的姑娘怎么能嫁给丑癞蛤蟆呢？它们聚到绿叶的梗子周围，用牙齿把叶梗咬断。叶子带着拇指姑娘顺水漂走了，漂得非常远，漂到癞蛤蟆再也找不到的地方。

拇指姑娘漂过许许多多的地方。灌木林里的小鸟看到她，都唱道：“多么美丽的一位小姑娘啊！”叶子托着她越漂越远，最后她漂到了外国。

一只可爱的白蝴蝶不停地围着她飞，最后落到叶子上。拇指姑娘也很高兴，因为癞蛤蟆再也找不到她了。太阳照在水面上，像最亮的金子。她解下腰带，一端系在蝴蝶身上，另一端系在叶子上。蝴蝶拉着叶子在水上飞快地前进。

这时，一只大金龟子飞来。他看见拇指姑娘，立刻用爪子抓住她纤细的腰，带着她飞到树上。绿叶继续顺着溪水漂流，那只被系在叶子上的蝴蝶也只能跟着漂走。

可怜的拇指姑娘非常害怕。她也很担心那只白蝴蝶：如果没有办法挣脱，他一定会饿死。可是金龟子一点儿也不在意。他和拇指姑娘一起坐在树上最大的一片绿叶上，把花蜜拿给她吃，还说她非常漂亮，虽然一点儿也不像金龟子。

不久，住在树上的金龟子都来拜访了。他们打量着拇指姑娘。金龟子小姐们耸着触角说：“她只有两条腿，真难看！”“她连触角都没有！”“她的腰太细了，完全像一个人，多么丑啊！”

其实拇指姑娘非常美丽，抓走她的金龟子原来也是这样想的。不过大家都说她难看，他最后也相信了，不愿意再要她。他们把她从树上带下来，放在一朵雏菊上。她伤心地哭了，因为她以为自己太丑，连金龟子也不要她。可是她仍然是一个想象不到的美丽人儿，那么娇嫩，那么可爱，像一片最纯洁的玫瑰花瓣。

整个夏天，可怜的拇指姑娘孤单地住在大树林里。她用草叶为自己编了一张小床，把它挂在一片大牛蒡叶下面，不让雨淋到身上。她吃花蜜，喝每天早晨凝结在叶子上的露珠。

夏天和秋天过去了，又冷又长的冬天来了。为她唱歌的鸟儿都飞走了，树叶和花朵都凋谢了。她住的大牛蒡叶也卷了起来，只剩下一根枯黄的梗。她的衣服破了，身体又那么瘦小纤细，冷得直发抖。

雪开始落下来。每一朵雪花落在她身上，就像一满铲雪打在我们身上一样，因为我们很高大，而她只有一寸来长。她把自己裹在一片干叶子里，可是一点儿也不暖和。

树林旁边有一块大麦田，麦子早已收割了，冻结的地上只留着光秃秃的麦梗。对她来说，从麦梗中间走过，就像穿过一片大森林。她冻得瑟瑟发抖，最后来到一只田鼠的门口。那是麦根下面的一个小洞，田鼠住在里面，又温暖又舒服。她藏着满满一房间麦子，还有漂亮的厨房和饭厅。

可怜的拇指姑娘站在门口，像一个讨饭的穷孩子。她请求田鼠给她一颗大麦粒，因为她已经两天没有吃东西了。

“你这个可怜的小人儿，”好心的老田鼠说，“到我温暖的房子里来，和我一起吃点东西吧。”

田鼠非常喜欢拇指姑娘，就说：“你可以和我住在一起，度过这个冬天。不过你得把我的房间收拾得干净整齐，还要讲故事给我听，因为我最喜欢听故事。”拇指姑娘答应了老田鼠的要求，在那儿住得非常快乐。

“不久我们会有一位客人来，”田鼠说，“我的邻居每星期来看我一次。他住得比我舒服，有宽大的房间，还穿着漂亮的黑天鹅绒袍子。只要你能做他的妻子，一辈子就享用不尽了。不过他的眼睛看不见，你得把最美的故事讲给他听。”

拇指姑娘对这件事一点儿兴趣也没有。她不愿意和这位邻居结婚，因为他是一只鼹鼠。

## 4. 拇指姑娘（下）

鼹鼠穿着黑天鹅绒袍子来拜访。田鼠说他多么富有，多么有学问，他的家比田鼠的房子大二十倍。可是他不喜欢太阳和美丽的花朵，还总说这些东西的坏话，因为他从来没有看见过它们。

拇指姑娘为他唱了“金龟子呀，飞走吧”和“牧师走上草原”。她的声音非常优美，鼹鼠爱上了她。不过他没有表现出来，因为他是一个很谨慎的人。

鼹鼠在自己房子里挖了一条长长的地道，一直通到田鼠的家。他请田鼠和拇指姑娘随时到地道里散步，不过提醒她们不要害怕躺在地道里的一只死鸟。那是一只完整的鸟，有翅膀也有嘴，大概在冬天开始时死去，正好被埋在鼹鼠挖地道的地方。

鼹鼠嘴里衔着一根能在黑暗里发光的引火木，走在前面为她们照明。来到死鸟躺着的地方时，他用大鼻子顶着天花板向上拱土，拱出一个大洞，让阳光照进来。

地道中央躺着一只燕子。他美丽的翅膀紧贴着身体，小腿和头缩在羽毛里，看起来像是冻死了。拇指姑娘非常难过，因为她喜爱一切鸟儿，它们整个夏天都为她唱美妙的歌。

鼹鼠用短腿把燕子一推，说：“他再也不能唱歌了！做一只小鸟多么可怜啊！谢天谢地，我的孩子不会这样。这样的鸟什么事也不能做，只会叽叽喳喳地叫，冬天一到就只能饿死！”

“你说得有道理。”田鼠说，“冬天一到，这些歌声有什么用呢？他只有挨饿和受冻。”

拇指姑娘一句话也没有说。等他们转过身去，她弯下腰，把盖在燕子头上的羽毛轻轻拨开，在他闭着的眼睛上吻了一下。

“也许夏天为我唱歌的就是他，”她想，“这只亲爱的、美丽的鸟儿曾经带给我多少快乐啊！”

鼹鼠把透进阳光的洞封起来，陪两位小姐回了家。那天晚上，拇指姑娘怎么也睡不着。她爬起来，用草编了一张宽大美丽的毯子，送到燕子身旁，把他的全身盖好；又找来一些软棉花裹在他身边，让他能在寒冷的地上睡得暖和。

“再会吧，美丽的小鸟！”她说，“谢谢你在夏天为我唱出美丽的歌声。”她把头贴在鸟儿的胸膛上，忽然吓了一跳，因为他的身体里有东西在跳动。那是鸟儿的心。他没有死，只是冻得失去了知觉；现在暖和起来，又活过来了。

拇指姑娘虽然害怕这只比她大得多的鸟儿，还是鼓起勇气，把棉花紧紧裹在他身上，又把自己当被子盖的薄荷叶拿来盖住他的头。

第二天夜里，她又悄悄来看他。他已经活过来了，不过仍有点儿昏迷，只能微微睁开眼睛看她。

“谢谢你，可爱的小宝宝！”燕子说，“我现在又舒服又温暖！不久我就能恢复力气，重新在温暖的阳光中飞翔。”

“外面太冷了，雪花在飞，到处都结着冰。请你睡在温暖的床上吧，我会照料你。”拇指姑娘说。

她用花瓣盛水给燕子喝。燕子告诉她，一只翅膀曾被多刺的灌木擦伤，所以没能跟别的燕子一起飞到遥远温暖的国度，最后掉到地上。其他的事情他已经记不起来了。

燕子在这里住了一整个冬天。拇指姑娘细心照料他，非常喜欢他。鼹鼠和田鼠一点儿也不知道这件事，因为他们不喜欢这只可怜、孤独的燕子。

春天来了，太阳把大地照得很暖。拇指姑娘打开鼹鼠挖的洞，阳光美丽地照着他们。燕子问她愿不愿意一起离开，她可以骑在他的背上，远远地飞向绿色的树林。不过拇指姑娘怕田鼠伤心。

“不行，我不能离开。”她说。

“那么再见吧，善良可爱的姑娘！”燕子说完，向太阳飞去。拇指姑娘望着他，眼里含着泪水，因为她非常喜爱这只燕子。

“滴沥！滴沥！”燕子唱着歌，飞向绿色的森林。

拇指姑娘非常难过。她不许走到温暖的阳光中去。田鼠屋顶上的麦子已经长得很高，对只有一寸高的她来说，简直是一片浓密的森林。

“这个夏天，你得把嫁衣缝好！”田鼠说。那个穿黑天鹅绒袍子的鼹鼠已经向她求婚了。“你得准备好毛衣和棉衣。做鼹鼠太太以后，你应该有坐着穿和睡觉穿的各种衣服。”

拇指姑娘只好摇纺车。鼹鼠请来四只蜘蛛，日夜为她纺纱织布。每天晚上鼹鼠都来拜访，咕噜着说等夏天过去，他就要和拇指姑娘结婚。

拇指姑娘一点儿也不高兴，她不喜欢这只讨厌的鼹鼠。每天早晨太阳升起、每天傍晚太阳落下时，她就偷偷走到门口。风把麦穗吹向两边，她能看见蔚蓝的天空，便想起外面多么光明美丽，盼望再见到亲爱的燕子。可是燕子一直没有回来，他一定已经飞到很远很远的青翠树林去了。

秋天到了，拇指姑娘的嫁衣全部做好了。

“四个星期后就举行婚礼。”田鼠说。拇指姑娘哭起来，说她不愿意嫁给讨厌的鼹鼠。

“胡说！”田鼠说，“你不要固执，不然我就用白牙齿咬你！他是一个很可爱的人，连皇后也没有他那样好的黑天鹅绒袍子。他的厨房和储藏室里装满了东西。你应该为得到这样的丈夫感到庆幸！”

婚礼就要举行了。鼹鼠亲自来迎接拇指姑娘。她将跟他深深地住在地底下，永远不能再到温暖的太阳下面去，因为鼹鼠不喜欢太阳。可怜的小姑娘非常难过，她不得不向光明的太阳告别。

“再见吧，光明的太阳！”她向空中伸出双手，走到田鼠屋外。大麦已经收割，只剩下干枯的梗子。“再见吧，再见吧！”她重复着，用双臂抱住一朵还开着的小红花，“假如你看见小燕子，请代我向他问候。”

“滴沥！滴沥！”她的头顶忽然响起一个声音。她抬头一看，正是那只小燕子。他看见拇指姑娘，非常高兴。她告诉燕子，自己多么不愿意让丑鼹鼠做丈夫，不愿意住在太阳永远照不到的地底下。说到这里，她忍不住哭起来。

“寒冷的冬天就要来了，”燕子说，“我要飞到温暖的国度。你愿意跟我一起去吗？你可以骑在我的背上，用腰带把自己系牢。这样我们就能离开丑鼹鼠和他的黑房子，远远飞过高山，飞到只有夏天、永远开着美丽花朵的国度。跟我一起飞吧，甜蜜的小拇指姑娘！你曾在阴森的地洞里救了我的生命！”

“是的，我要和你一起去！”拇指姑娘说。她坐在鸟儿背上，把脚放在他展开的翅膀上，用腰带把自己系在一根结实的羽毛上。

燕子飞向空中，飞过森林和大海，高高地飞过常年积雪的大山。拇指姑娘在寒冷的高空中冻得发抖，便钻进燕子温暖的羽毛里，只把小脑袋伸出来欣赏下面美丽的风景。

他们终于来到温暖的国度。这里阳光灿烂，天空似乎也加倍地高。田沟和篱笆上长满最美丽的绿葡萄和紫葡萄，树林里挂着柠檬和橙子，空气里飘着桃金娘和麝香的香气。可爱的孩子们在路上跟色彩鲜艳的大蝴蝶一起玩耍。

燕子越飞越远，景色也越来越美。在碧蓝的湖边有一片可爱的绿树林，里面有一幢白得发亮的古老大理石宫殿。葡萄藤缠绕着高大的柱子，柱顶上有许多燕子窝，其中一个就是这只燕子的家。

“这儿就是我的房子，”燕子说，“下面长着许多美丽的花，你可以选一朵，我把你放在上面。你想住得多么舒服都可以。”

“那好极了！”拇指姑娘拍着小手说。

一根巨大的大理石柱倒在地上，断成三段，石块中间长出一朵最美丽的白花。燕子把拇指姑娘放在一片宽阔的花瓣上。她惊奇地发现，花朵中央坐着一个小小的男子。他白皙透明，像玻璃做成的，头戴华丽的金王冠，肩上长着一双发亮的翅膀，和拇指姑娘一样高。他就是花中的天使。每一朵花里都住着这样的小人，而这一位是他们的王子。

“天哪，他多么美啊！”拇指姑娘对燕子低声说。

小王子起初有点害怕燕子，因为燕子对他来说是一只庞大的鸟。不过当他看到拇指姑娘，立刻高兴起来：她是他一生中见过的最美丽的姑娘。

王子摘下自己的金王冠，戴到她头上，问她叫什么名字，愿不愿意做他的妻子，成为所有花儿的皇后。这才是一位真正适合她的丈夫，跟癞蛤蟆的儿子和穿黑天鹅绒袍子的鼹鼠完全不同。拇指姑娘对这位可爱的王子说：“我愿意。”

每一朵花里都走出一位小姐或一位男子。他们都非常可爱，每人送给拇指姑娘一件礼物。其中最好的礼物，是从一只大白苍蝇身上取下的一对翅膀。他们把翅膀安在拇指姑娘背上，这样她就可以在花朵之间飞来飞去了。

大家都欢乐起来。燕子坐在上面的窝里，为他们唱出最美的歌。不过他的心里有些悲伤，因为他非常喜欢拇指姑娘，希望永远不要和她分开。

“你不应该再叫拇指姑娘了，”花王子对她说，“这个名字不好听，而你这么美丽！从今以后，我们叫你玛娅。”

“再见吧！再见吧！”燕子说。他从温暖的国度飞走，回到很远很远的丹麦，在一个会写童话的人的窗子上筑了一个窝。他对那个人唱：“滴沥！滴沥！”这个故事就是从他那里听来的。
